name: Release PJRT CPU

# Builds the PJRT CPU plugin for every platform r-xla supports from one
# openxla/xla commit and publishes them as the release pjrt-cpu-<short sha>.
#
# linux-amd64, linux-arm64, darwin-arm64 and darwin-amd64 are built the way
# zml/pjrt-artifacts builds them: hermetic toolchains on linux x86, macOS
# cross-compiled, with their bazelrc (bazelrc/cpu), patches (patch/pjrt/cpu)
# and bazel flags (the matrix below), copied into this repository. Only zml's
# BuildBuddy remote build is left out. windows-amd64, which zml does not ship,
# comes from .github/actions/build-windows.

on:
  workflow_dispatch:
    inputs:
      xla_commit:
        description: "openxla/xla commit (short or full hash)"
        required: true
        type: string
      only:
        description: "Space-separated builds to run, e.g. 'cpu_linux-amd64 cpu_windows-amd64'. Skips the release."
        required: false
        type: string

permissions:
  contents: write

env:
  # Minutes bazel may build before it is stopped so that the job can still
  # save its cache within GitHub's 6 hour job limit. Re-running the failed job
  # continues from that cache.
  BUILD_MINUTES: 300
  # The bazel version zml builds the CPU plugins with.
  BAZEL_VERSION: 8.5.1

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      windows: ${{ steps.matrix.outputs.windows }}
      xla_commit: ${{ steps.xla.outputs.commit }}
      tag: ${{ steps.xla.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Fails here, not hours into the builds, when the patches don't apply.
      - name: Resolve the XLA commit and check the patches apply
        id: xla
        env:
          XLA_COMMIT: ${{ inputs.xla_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --filter=blob:none https://github.com/openxla/xla xla
          sha=$(git -C xla rev-parse --verify "$XLA_COMMIT^{commit}")
          git -C xla checkout -q "$sha"
          shopt -s nullglob
          # Each set in order, as the builds apply them.
          for set in "patch/pjrt/cpu/*.patch" "patch/pjrt/windows/*.patch"; do
            for patch in $set; do
              git -C xla apply "../$patch" || { echo "::error::$patch does not apply to openxla/xla@$sha"; exit 1; }
              echo "ok $patch"
            done
            git -C xla checkout -q . && git -C xla clean -qfd
          done
          tag="pjrt-cpu-${sha:0:7}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Delete it first to rebuild it."
            exit 1
          fi
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # zml's CPU rows (.github/workflows/_build.yaml of zml/pjrt-artifacts),
      # without the flags for their BuildBuddy remote build.
      - name: Build matrix
        id: matrix
        env:
          ONLY: ${{ inputs.only }}
        run: |
          matrix=$(jq -c . <<'JSON'
          {"include": [
            {"target": "cpu", "platform": "linux-amd64",
             "config": "--config=hermetic_linux_x86 --config=baseline_x86_64 --config=bzlmod",
             "artifact": "bazel-bin/xla/pjrt/c/libpjrt_c_api_cpu_plugin.so", "renamed_artifact": "libpjrt_cpu.so"},
            {"target": "cpu", "platform": "linux-arm64",
             "config": "--config=hermetic_linux_arm64 --config=baseline_arm64 --config=bzlmod",
             "artifact": "bazel-bin/xla/pjrt/c/libpjrt_c_api_cpu_plugin.so", "renamed_artifact": "libpjrt_cpu.so"},
            {"target": "cpu", "platform": "darwin-arm64",
             "config": "--config=hermetic_macos_arm64 --config=bzlmod",
             "artifact": "bazel-bin/xla/pjrt/c/libpjrt_c_api_cpu_plugin.dylib", "renamed_artifact": "libpjrt_cpu.dylib"},
            {"target": "cpu", "platform": "darwin-amd64",
             "config": "--config=hermetic_macos_x86 --config=bzlmod --//xla/tsl/framework/contraction:disable_onednn_contraction_kernel=True",
             "artifact": "bazel-bin/xla/pjrt/c/libpjrt_c_api_cpu_plugin.dylib", "renamed_artifact": "libpjrt_cpu.dylib"}
          ]}
          JSON
          )
          windows=true
          if [ -n "$ONLY" ]; then
            matrix=$(jq -c --arg only "$ONLY" '
              ($only | split(" ")) as $keep
              | .include |= map(select((.target + "_" + .platform) as $k | $keep | index($k)))
            ' <<< "$matrix")
            [[ " $ONLY " == *" cpu_windows-amd64 "* ]] || windows=false
          fi
          jq . <<< "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}_${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    # Like zml, every platform builds on linux x86 (macOS cross-compiled).
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      XLA_COMMIT: ${{ needs.plan.outputs.xla_commit }}
      NAME: pjrt-${{ matrix.target }}_${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: pjrt-builds

      - uses: actions/checkout@v4
        with:
          repository: openxla/xla
          ref: ${{ env.XLA_COMMIT }}
          path: xla

      # zml's CPU setup: their bazelrc replaces XLA's .bazelrc and
      # tensorflow.bazelrc, then the patches.
      - name: Apply patches
        working-directory: xla
        run: |
          cp ../pjrt-builds/bazelrc/cpu/.bazelrc ../pjrt-builds/bazelrc/cpu/tensorflow.bazelrc .
          for patch in ../pjrt-builds/patch/pjrt/cpu/*.patch; do
            echo "Applying $patch"
            git apply "$patch"
          done

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/bazel
          sudo chown "$USER" /mnt/bazel
          df -h

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: 1.26.0
          bazelisk-cache: false
          bazelrc: |
            startup --output_user_root=/mnt/bazel/root
            common --disk_cache=/mnt/bazel/disk
            common --verbose_failures
            common --color=yes
            common --show_timestamps

      - name: Restore the cache of an earlier attempt
        uses: actions/cache/restore@v4
        with:
          path: /mnt/bazel/disk
          key: bazel-${{ env.NAME }}-${{ env.XLA_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bazel-${{ env.NAME }}-${{ env.XLA_COMMIT }}-

      - name: Build
        id: build
        working-directory: xla
        env:
          USE_BAZEL_VERSION: ${{ env.BAZEL_VERSION }}
        run: |
          status=0
          timeout --signal=INT "${BUILD_MINUTES}m" \
            bazel build ${{ matrix.config }} //xla/pjrt/c:pjrt_c_api_cpu_plugin || status=$?
          if [ "$status" = 124 ]; then
            echo "::error::Stopped after $BUILD_MINUTES minutes. Re-run the failed job to continue from the saved cache."
          fi
          exit "$status"

      - name: Save the cache for a re-run
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: /mnt/bazel/disk
          key: bazel-${{ env.NAME }}-${{ env.XLA_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package
        run: |
          cp xla/${{ matrix.artifact }} ${{ matrix.renamed_artifact }}
          tar -czf "$NAME.tar.gz" ${{ matrix.renamed_artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz

  windows:
    name: Build cpu_windows-amd64
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pjrt-builds

      - uses: ./pjrt-builds/.github/actions/build-windows
        with:
          xla_commit: ${{ needs.plan.outputs.xla_commit }}

      - uses: actions/upload-artifact@v4
        with:
          name: pjrt-cpu_windows-amd64
          path: pjrt-cpu_windows-amd64.tar.gz

  release:
    needs: [plan, build, windows]
    # Only complete sets: no release for runs restricted with `only`.
    if: ${{ !cancelled() && inputs.only == '' && needs.build.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check that all five plugins are there
        run: |
          ls -l dist
          for p in linux-amd64 linux-arm64 darwin-arm64 darwin-amd64 windows-amd64; do
            test -f "dist/pjrt-cpu_$p.tar.gz" || { echo "::error::missing pjrt-cpu_$p.tar.gz"; exit 1; }
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: PJRT CPU ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            PJRT CPU plugins built from openxla/xla@${{ needs.plan.outputs.xla_commit }}.

            Built with r-xla/pjrt-builds@${{ github.sha }}: linux and macOS with the build setup of zml/pjrt-artifacts (bazelrc/cpu, patch/pjrt/cpu), windows with .github/actions/build-windows.
