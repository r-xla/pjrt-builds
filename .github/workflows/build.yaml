on:
  workflow_dispatch:
    inputs:
      commit_hash:
        type: string
        description: 'Commit hash to build from (default: 6319f0d)'
        required: false
        default: 6319f0d

name: Build PJRT

permissions:
  contents: write

jobs:
  build:
    name: Build PJRT

    strategy:
      fail-fast: false
      matrix:
        
        config:
          - {os: mac}
          - {os: linux}
          - {os: linux-arm}
          - {os: linux, plugin: gpu}
          - {os: windows}

        include:
          - config: {os: mac}
            runner: macos-latest
            artifact_name: libpjrt_cpu.dylib
            shell: bash
            configure_args: --backend=cpu
            build_args: --config=clang_local
            target: pjrt_c_api_cpu_plugin.so
          - config: {os: linux}
            runner: ubuntu-latest
            artifact_name: libpjrt_cpu.so
            shell: bash
            setup: sudo apt-get update && sudo apt-get install -y clang
            configure_args: --backend=cpu --host_compiler=clang
            build_args: --config=clang_local --repo_env=CC=clang --repo_env=CXX=clang++
            target: pjrt_c_api_cpu_plugin.so
          - config: {os: linux-arm}
            runner: ubuntu-24.04-arm
            artifact_name: libpjrt_cpu.dylib
            shell: bash
            setup: sudo apt-get update && sudo apt-get install -y clang
            configure_args: --backend=cpu --host_compiler=clang
            build_args: --config=clang_local --repo_env=CC=clang --repo_env=CXX=clang++
            target: pjrt_c_api_cpu_plugin.so
          - config: {os: linux, plugin: gpu}
            runner: ubuntu-latest
            artifact_name: libpjrt_gpu.so
            shell: bash
            target: pjrt_c_api_gpu_plugin.so
          - config: {os: windows}
            runner: windows-latest
            shell: bash
            artifact_name: pjrt_cpu.dll
            target: pjrt_c_api_cpu_plugin.so
            setup: |
              choco install llvm -y
            configure_args: --backend=cpu --os=windows --host_compiler=clang --clang_path=C:/PROGRA~1/LLVM/bin/clang.exe
            build_args: | 
                --config=clang_local \
                --action_env=CC=C:/PROGRA~1/LLVM/bin/clang.exe \
                --action_env=CXX=C:/PROGRA~1/LLVM/bin/clang++.exe \
                --linkopt="--ld-path=C:/PROGRA~1/LLVM/bin/ld.lld.exe" \
                --repo_env=USE_CLANG_CL=1 \
                --repo_env=BAZEL_LLVM=C:/PROGRA~1/LLVM \
                --copt=/DCOMPILER_MSVC --host_copt=/DCOMPILER_MSVC \
                --copt=/D_USE_MATH_DEFINES --host_copt=/D_USE_MATH_DEFINES \
                --copt=-DWIN32_LEAN_AND_MEAN --host_copt=-DWIN32_LEAN_AND_MEAN \
                --copt=-DNOGDI --host_copt=-DNOGDI \
                --copt=/Zc:preprocessor \
                --copt=-march=native \
                --define xnn_enable_arm_fp16_scalar=false \
                --define xnn_enable_arm_fp16_vector=false \
                --define xnn_enable_arm_bf16=false \
                --define xnn_enable_arm_dotprod=false \
                --define xnn_enable_arm_i8mm=false \
                --define xnn_enable_arm_sme=false \
                --define xnn_enable_arm_sme2=false \
                --define xnn_enable_riscv_vector=false \
                --define xnn_enable_riscv_fp16_vector=false \
                --define xnn_enable_avxvnni=false \
                --define xnn_enable_avxvnniint8=false \
                --define xnn_enable_avx256skx=false \
                --define xnn_enable_avx256vnni=false \
                --define xnn_enable_avx256vnnigfni=false \
                --define xnn_enable_avx512f=false \
                --define xnn_enable_avx512skx=false \
                --define xnn_enable_avx512vbmi=false \
                --define xnn_enable_avx512vnni=false \
                --define xnn_enable_avx512vnnigfni=false \
                --define xnn_enable_avx512amx=false \
                --define xnn_enable_avx512fp16=false \
                --define xnn_enable_avx512bf16=false \
                --define xnn_enable_hvx=false \
    
    runs-on: ${{ matrix.runner }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ github.event.inputs.commit_hash }}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - run: ${{ matrix.setup }}

      - run: |
          git clone https://github.com/openxla/xla
          cd xla
          git checkout ${{ github.event.inputs.commit_hash }}

      - run: |
          cd xla
          python configure.py ${{ matrix.configure_args }}
          cat xla_configure.bazelrc
          
      - name: Fix Windows paths in bazelrc
        if: matrix.config.os == 'windows'
        shell: bash
        run: |
          cd xla
          # Fix Windows paths for Bazel compatibility
          # Replace "Program Files" with short name (handles both / and \ separators)
          sed -i 's|Program Files|PROGRA~1|g' xla_configure.bazelrc
          # Convert all backslashes to forward slashes
          sed -i 's|\\|/|g' xla_configure.bazelrc
          cat xla_configure.bazelrc

          echo "Applying patch ---------------"
          git apply ../patch/pjrt/export.patch

          # USE_CLANG_CL=1 trips an upstream rules_cc bug: the clang-cl branch of
          # _get_msvc_vars fills in CL, ML, LINK and LIB but never DUMPBIN, while
          # the template below reads build_tools["DUMPBIN"] unconditionally, so
          # configuration dies with
          #   Error: key "DUMPBIN" not found in dictionary
          # bazelbuild/rules_cc#308, open since 2025-01 and still present in the
          # latest release, so there is no version to upgrade to. XLA fetches
          # rules_cc through WORKSPACE (bzlmod is off -- see .bazelrc line 2) and
          # that http_archive already takes a patch list, so add ours to it. That
          # also keeps XLA's own rules_cc patch, which overriding the repo
          # wholesale would drop.
          cp ../patch/pjrt/rules_cc_dumpbin.patch third_party/py/rules_cc_dumpbin.patch
          python - <<'PATCH'
          import pathlib
          p = pathlib.Path("workspace3.bzl")
          s = p.read_text()
          anchor = '            "@xla//third_party/py:rules_cc_protobuf.patch",\n'
          added = '            "@xla//third_party/py:rules_cc_dumpbin.patch",\n'
          assert s.count(anchor) == 1, s.count(anchor)
          p.write_text(s.replace(anchor, anchor + added))
          print("registered rules_cc_dumpbin.patch in workspace3.bzl")
          PATCH

          # XLA's net_zstd.BUILD selects decompress/*_amd64.S on any x86_64
          # platform, Windows included. Those are GNU-syntax assembly, and on
          # Windows bazel hands .S files to ml64.exe (MASM), which cannot parse
          # them and rejects the C copts it is passed:
          #   MASM : fatal error A1013:invalid numerical command-line argument : /W
          # Drop them on Windows and let zstd use its C fallback. ZSTD_DISABLE_ASM
          # is set alongside, so the C code cannot reference the asm entry points
          # we just removed regardless of whether clang-cl defines __GNUC__
          # (which is what gates ZSTD_ASM_SUPPORTED).
          python - <<'PATCH'
          import pathlib
          p = pathlib.Path("third_party/net_zstd.BUILD")
          s = p.read_text()
          a1 = 'licenses(["notice"])\n'
          cs = 'config_setting(\n    name = "x86_64_windows",\n    constraint_values = [\n        "@platforms//cpu:x86_64",\n        "@platforms//os:windows",\n    ],\n)\n'
          assert s.count(a1) == 1, s.count(a1)
          s = s.replace(a1, a1 + "\n" + cs)
          a2 = '        ":x86_64": glob(["decompress/*_amd64.S"]),\n'
          assert s.count(a2) == 1, s.count(a2)
          s = s.replace(a2, '        ":x86_64_windows": [],\n' + a2)
          a3 = '    includes = ["."],\n'
          ld = '    local_defines = select({\n        ":x86_64_windows": ["ZSTD_DISABLE_ASM"],\n        "//conditions:default": [],\n    }),\n'
          assert s.count(a3) == 1, s.count(a3)
          s = s.replace(a3, a3 + ld)
          p.write_text(s)
          print("net_zstd.BUILD: GNU-syntax asm excluded on windows")
          PATCH

      - run: |
          cd xla
          bazel build ${{ matrix.build_args }} //xla/pjrt/c:${{ matrix.target }}

      - name: Rename binary with OS info
        shell: bash
        run: |
          OS=$(echo "${{ matrix.config.os }}" | cut -d'-' -f1)
          ARCH=$(uname -m)
          cp xla/bazel-bin/xla/pjrt/c/${{ matrix.target }} ${{ matrix.artifact_name }}
          if [[ "$OS" == "windows" ]]; then
            FILENAME="pjrt-${VERSION}-${OS}-${ARCH}.zip"
            7z a "$FILENAME" ${{ matrix.artifact_name }}
          else
            FILENAME="pjrt-${VERSION}-${OS}-${ARCH}.tar.gz"
            tar -czvf "$FILENAME" ${{ matrix.artifact_name }}
          fi
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FILENAME }}
          name: PJRT ${{ matrix.config.plugin}}
          tag_name: pjrt${{matrix.config.plugin}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
