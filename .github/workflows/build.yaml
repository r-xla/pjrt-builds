name: Build PJRT

# Builds the PJRT plugins of the zml/pjrt-artifacts release pinned in zml.env:
# its XLA commits, its patches and its bazel flags, read from that release at
# run time. Only the runners and the release are ours. Windows, which zml does
# not ship, is built from the same XLA commit with our own toolchain setup.

on:
  workflow_dispatch:
    inputs:
      xla_commit:
        description: "openxla/xla commit for the CPU plugins (default: the one zml pins)"
        required: false
        type: string
      cuda_xla_commit:
        description: "zml/xla commit for the CUDA plugins (default: the one zml pins)"
        required: false
        type: string
      cuda_compute_capabilities:
        description: "HERMETIC_CUDA_COMPUTE_CAPABILITIES, e.g. 8.0,9.0 (default: zml's list)"
        required: false
        type: string
      only:
        description: "Space-separated builds to run, e.g. 'cpu_linux-amd64 cpu_windows-amd64' (default: all)"
        required: false
        type: string
      runner:
        description: "Machines for the linux builds: GitHub-hosted, or RunsOn on our AWS account"
        required: false
        type: choice
        options: [github, runs-on]
        default: github
      release:
        description: "Publish the plugins as a GitHub release"
        required: false
        type: boolean
        default: false
      tag:
        description: "Release tag (default: zml-<ZML_REF>; required when overriding a commit)"
        required: false
        type: string

permissions:
  contents: write

env:
  # Minutes bazel may build before it is stopped so that the job can still
  # save its cache within GitHub's 6 hour job limit. Re-running the failed job
  # continues from that cache.
  BUILD_MINUTES: 300

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      zml_sha: ${{ steps.pins.outputs.zml_sha }}
      xla_commit: ${{ steps.pins.outputs.xla_commit }}
      cuda_xla_commit: ${{ steps.pins.outputs.cuda_xla_commit }}
      tag: ${{ steps.pins.outputs.tag }}
      windows: ${{ steps.matrix.outputs.windows }}
    steps:
      - uses: actions/checkout@v4

      - name: Read zml.env
        run: |
          source zml.env
          echo "ZML_REF=$ZML_REF" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: zml/pjrt-artifacts
          ref: ${{ env.ZML_REF }}
          path: zml

      - name: Resolve pins
        id: pins
        env:
          INPUT_XLA_COMMIT: ${{ inputs.xla_commit }}
          INPUT_CUDA_XLA_COMMIT: ${{ inputs.cuda_xla_commit }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          source zml/openxla/commits.env
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            if [ -n "$INPUT_XLA_COMMIT$INPUT_CUDA_XLA_COMMIT" ]; then
              echo "::error::Overriding an XLA commit needs an explicit tag"
              exit 1
            fi
            tag="zml-$ZML_REF"
          fi
          {
            echo "zml_sha=$(git -C zml rev-parse HEAD)"
            echo "xla_commit=${INPUT_XLA_COMMIT:-$XLA_COMMIT}"
            echo "cuda_xla_commit=${INPUT_CUDA_XLA_COMMIT:-$CUDA_XLA_COMMIT}"
            echo "tag=$tag"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Derive the build matrix from zml's
        id: matrix
        env:
          ONLY: ${{ inputs.only }}
        run: |
          matrix=$(yq -o=json zml/.github/workflows/_build.yaml | python3 tools/zml-matrix.py)
          windows=true
          if [ -n "$ONLY" ]; then
            matrix=$(jq -c --arg only "$ONLY" '
              ($only | split(" ")) as $keep
              | .include |= map(select((.target + "_" + .platform) as $k | $keep | index($k)))
            ' <<< "$matrix")
            [[ " $ONLY " == *" cpu_windows-amd64 "* ]] || windows=false
          fi
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}_${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    # RunsOn: 64 on-demand cores for CUDA (an hour-long build is too likely to
    # lose a spot instance), 32 spot cores for CPU, and actions/cache backed by
    # S3 (extras=s3-cache) instead of GitHub's 10 GB.
    runs-on: >-
      ${{ inputs.runner == 'runs-on'
        && format('runs-on={0}/cpu={1}/family={2}/image=ubuntu22-full-{3}/volume=200gb/extras=s3-cache',
                  github.run_id,
                  matrix.target == 'cuda' && '64/spot=false' || '32',
                  matrix.arch == 'arm64' && 'c7g+m7g' || 'c7a+c7i+m7a+m7i',
                  matrix.arch)
        || (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      XLA_REPO: ${{ matrix.target == 'cuda' && 'zml/xla' || 'openxla/xla' }}
      XLA_COMMIT: ${{ matrix.target == 'cuda' && needs.plan.outputs.cuda_xla_commit || needs.plan.outputs.xla_commit }}
      NAME: pjrt-${{ matrix.target }}_${{ matrix.platform }}
    steps:
      - uses: runs-on/action@v1
        if: inputs.runner == 'runs-on'

      - uses: actions/checkout@v4
        with:
          path: pjrt-builds

      - uses: actions/checkout@v4
        with:
          repository: zml/pjrt-artifacts
          ref: ${{ needs.plan.outputs.zml_sha }}
          path: zml

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.XLA_REPO }}
          ref: ${{ env.XLA_COMMIT }}
          path: xla

      # Mirrors zml: the CPU build applies their patches and bazelrc to
      # openxla/xla; zml/xla, which the CUDA build uses, already carries both.
      # Our own patches go on top.
      - name: Apply patches
        working-directory: xla
        run: |
          shopt -s nullglob
          patches=()
          if [ "${{ matrix.target }}" = cpu ]; then
            patches+=(../zml/openxla/patches/upstream/*.patch ../zml/openxla/patches/upstream-cpu/*.patch)
            cp ../zml/openxla/bazelrc/upstream/.bazelrc ../zml/openxla/bazelrc/upstream/*.bazelrc .
          fi
          patches+=(../pjrt-builds/patch/pjrt/${{ matrix.target }}/*.patch)
          for patch in "${patches[@]}"; do
            echo "Applying $patch"
            git apply "$patch"
          done

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/bazel
          sudo chown "$USER" /mnt/bazel
          df -h

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: 1.26.0
          bazelisk-cache: false
          bazelrc: |
            startup --output_user_root=/mnt/bazel/root
            common --disk_cache=/mnt/bazel/disk
            common --verbose_failures
            common --color=yes
            common --show_timestamps

      - name: Restore the cache of an earlier attempt
        uses: actions/cache/restore@v4
        with:
          path: /mnt/bazel/disk
          key: bazel-${{ env.NAME }}-${{ env.XLA_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bazel-${{ env.NAME }}-${{ env.XLA_COMMIT }}-

      - name: Build
        id: build
        working-directory: xla
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
          CUDA_COMPUTE_CAPABILITIES: ${{ inputs.cuda_compute_capabilities }}
        run: |
          extra=()
          if [ "${{ matrix.target }}" = cuda ] && [ -n "$CUDA_COMPUTE_CAPABILITIES" ]; then
            extra+=("--repo_env=HERMETIC_CUDA_COMPUTE_CAPABILITIES=$CUDA_COMPUTE_CAPABILITIES")
          fi
          status=0
          timeout --signal=INT "${BUILD_MINUTES}m" \
            bazel build ${{ matrix.config }} "${extra[@]}" ${{ matrix.bazel_target }} || status=$?
          if [ "$status" = 124 ]; then
            echo "::error::Stopped after $BUILD_MINUTES minutes. Re-run the failed job to continue from the saved cache."
          fi
          exit "$status"

      - name: Save the cache for a re-run
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: /mnt/bazel/disk
          key: bazel-${{ env.NAME }}-${{ env.XLA_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package
        run: |
          cp xla/${{ matrix.artifact }} ${{ matrix.renamed_artifact }}
          tar -czf "$NAME.tar.gz" ${{ matrix.renamed_artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz

  windows:
    name: Build cpu_windows-amd64
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - run: choco install llvm -y

      - run: |
          git clone https://github.com/openxla/xla
          cd xla
          git checkout ${{ needs.plan.outputs.xla_commit }}

      - run: |
          cd xla
          python configure.py --backend=cpu --os=windows --host_compiler=clang --clang_path=C:/PROGRA~1/LLVM/bin/clang.exe
          # Bazel wants short, forward-slashed paths.
          sed -i 's|Program Files|PROGRA~1|g' xla_configure.bazelrc
          sed -i 's|\\|/|g' xla_configure.bazelrc
          cat xla_configure.bazelrc

          git apply ../patch/pjrt/windows/export.patch

          # Selecting the clang-cl toolchain needs an execution platform carrying
          # the clang-cl constraint; --compiler alone only affects the target
          # configuration, leaving host tools on cl.exe. This mirrors jax's
          # //jax/tools/toolchains:x64_windows-clang-cl, used by its win_clang
          # config. See https://bazel.build/configure/windows#clang
          python - <<'PATCH'
          import pathlib
          p = pathlib.Path("tools/toolchains/win2022/BUILD")
          plat = 'platform(\n    name = "x64_windows-clang-cl",\n    constraint_values = [\n        "@platforms//cpu:x86_64",\n        "@platforms//os:windows",\n        "@bazel_tools//tools/cpp:clang-cl",\n    ],\n)\n'
          s = p.read_text()
          assert 'name = "x64_windows-clang-cl"' not in s
          p.write_text(s + "\n" + plat)
          print("added x64_windows-clang-cl exec platform")
          PATCH

      - name: Build
        run: |
          cd xla
          bazel build \
            --config=clang_local \
            --action_env=CC=C:/PROGRA~1/LLVM/bin/clang.exe \
            --action_env=CXX=C:/PROGRA~1/LLVM/bin/clang++.exe \
            --linkopt="--ld-path=C:/PROGRA~1/LLVM/bin/ld.lld.exe" \
            --compiler=clang-cl \
            --extra_toolchains=@local_config_cc//:cc-toolchain-x64_windows-clang-cl \
            --extra_execution_platforms=@xla//tools/toolchains/win2022:x64_windows-clang-cl \
            --repo_env=BAZEL_LLVM=C:/PROGRA~1/LLVM \
            --copt=-DCOMPILER_MSVC --host_copt=-DCOMPILER_MSVC \
            --copt=-D_USE_MATH_DEFINES --host_copt=-D_USE_MATH_DEFINES \
            --copt=-DWIN32_LEAN_AND_MEAN --host_copt=-DWIN32_LEAN_AND_MEAN \
            --copt=-DNOGDI --host_copt=-DNOGDI \
            --define xnn_enable_arm_fp16_scalar=false \
            --define xnn_enable_arm_fp16_vector=false \
            --define xnn_enable_arm_bf16=false \
            --define xnn_enable_arm_dotprod=false \
            --define xnn_enable_arm_i8mm=false \
            --define xnn_enable_arm_sme=false \
            --define xnn_enable_arm_sme2=false \
            --define xnn_enable_riscv_vector=false \
            --define xnn_enable_riscv_fp16_vector=false \
            --define xnn_enable_avxvnni=false \
            --define xnn_enable_avxvnniint8=false \
            --define xnn_enable_avx256skx=false \
            --define xnn_enable_avx256vnni=false \
            --define xnn_enable_avx256vnnigfni=false \
            --define xnn_enable_avx512f=false \
            --define xnn_enable_avx512skx=false \
            --define xnn_enable_avx512vbmi=false \
            --define xnn_enable_avx512vnni=false \
            --define xnn_enable_avx512vnnigfni=false \
            --define xnn_enable_avx512amx=false \
            --define xnn_enable_avx512fp16=false \
            --define xnn_enable_avx512bf16=false \
            --define xnn_enable_hvx=false \
            //xla/pjrt/c:pjrt_c_api_cpu_plugin.so

      - name: Package
        run: |
          cp xla/bazel-bin/xla/pjrt/c/pjrt_c_api_cpu_plugin.so pjrt_cpu.dll
          7z a pjrt-cpu_windows-amd64.zip pjrt_cpu.dll

      - uses: actions/upload-artifact@v4
        with:
          name: pjrt-cpu_windows-amd64
          path: pjrt-cpu_windows-amd64.zip

  release:
    needs: [plan, build, windows]
    if: ${{ !cancelled() && inputs.release && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: PJRT ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            Built from zml/pjrt-artifacts@${{ needs.plan.outputs.zml_sha }}.

            - openxla/xla: ${{ needs.plan.outputs.xla_commit }}
            - zml/xla (CUDA): ${{ needs.plan.outputs.cuda_xla_commit }}
            - CUDA compute capabilities: ${{ inputs.cuda_compute_capabilities || 'zml default' }}
