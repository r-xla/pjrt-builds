on:
  workflow_dispatch:
    inputs:
      commit_hash:
        type: string
        description: 'openxla/xla commit to build from (short or full hash)'
        required: true
      windows_only:
        type: boolean
        description: 'Build only the Windows plugin'
        required: false
        default: false
      release_tag:
        type: string
        description: 'Release tag for the Windows plugin (default: pjrt)'
        required: false
        default: pjrt

name: Build PJRT

permissions:
  contents: write

jobs:
  build:
    name: Build PJRT
    if: ${{ !inputs.windows_only }}

    strategy:
      fail-fast: false
      matrix:
        
        config:
          - {os: mac}
          - {os: linux}
          - {os: linux-arm}
          - {os: linux, plugin: gpu}

        include:
          - config: {os: mac}
            runner: macos-latest
            artifact_name: libpjrt_cpu.dylib
            shell: bash
            configure_args: --backend=cpu
            build_args: --config=clang_local
            target: pjrt_c_api_cpu_plugin.so
          - config: {os: linux}
            runner: ubuntu-latest
            artifact_name: libpjrt_cpu.so
            shell: bash
            setup: sudo apt-get update && sudo apt-get install -y clang
            configure_args: --backend=cpu --host_compiler=clang
            build_args: --config=clang_local --repo_env=CC=clang --repo_env=CXX=clang++
            target: pjrt_c_api_cpu_plugin.so
          - config: {os: linux-arm}
            runner: ubuntu-24.04-arm
            artifact_name: libpjrt_cpu.so
            shell: bash
            setup: sudo apt-get update && sudo apt-get install -y clang
            configure_args: --backend=cpu --host_compiler=clang
            build_args: --config=clang_local --repo_env=CC=clang --repo_env=CXX=clang++
            target: pjrt_c_api_cpu_plugin.so
          - config: {os: linux, plugin: gpu}
            runner: ubuntu-latest
            artifact_name: libpjrt_gpu.so
            shell: bash
            target: pjrt_c_api_gpu_plugin.so
    
    runs-on: ${{ matrix.runner }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ github.event.inputs.commit_hash }}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - run: ${{ matrix.setup }}

      - run: |
          git clone https://github.com/openxla/xla
          cd xla
          git checkout ${{ github.event.inputs.commit_hash }}

      - run: |
          cd xla
          python configure.py ${{ matrix.configure_args }}
          cat xla_configure.bazelrc
          
      - run: |
          cd xla
          bazel build ${{ matrix.build_args }} //xla/pjrt/c:${{ matrix.target }}

      - name: Rename binary with OS info
        shell: bash
        run: |
          OS=$(echo "${{ matrix.config.os }}" | cut -d'-' -f1)
          ARCH=$(uname -m)
          cp xla/bazel-bin/xla/pjrt/c/${{ matrix.target }} ${{ matrix.artifact_name }}
          FILENAME="pjrt-${VERSION}-${OS}-${ARCH}.tar.gz"
          tar -czvf "$FILENAME" ${{ matrix.artifact_name }}
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FILENAME }}
          name: PJRT ${{ matrix.config.plugin}}
          tag_name: pjrt${{matrix.config.plugin}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows is built like JAX builds jaxlib locally on Windows (its win_clang,
  # avx_windows and clang configs): a local clang-cl and XLA's own bazelrc,
  # plus bazelrc/windows/xla_configure.bazelrc and patch/pjrt/windows.
  # Mirrors the cpu windows-amd64 job proposed for zml/pjrt-artifacts.
  windows:
    name: Build PJRT (windows)
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      VERSION: ${{ github.event.inputs.commit_hash }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          path: pjrt-builds

      # actions/checkout only takes full SHAs; commit_hash is usually short.
      - name: Clone openxla/xla
        run: |
          git clone --filter=blob:none https://github.com/openxla/xla xla
          git -C xla checkout ${{ github.event.inputs.commit_hash }}

      - name: Install LLVM
        # The runner image's LLVM. 22.1.8 fails Bazel's include check on
        # clang's builtin headers (lib/clang/22/include).
        run: choco install llvm --version=20.1.8 --allow-downgrade -y

      - name: Apply patches
        working-directory: xla
        run: |
          for patch in ../pjrt-builds/patch/pjrt/windows/*.patch; do
            echo "Applying $patch"
            git apply "$patch"
          done
          cp ../pjrt-builds/bazelrc/windows/xla_configure.bazelrc .

      - name: Build
        working-directory: xla
        run: bazel build //xla/pjrt/c:pjrt_c_api_cpu_plugin.so

      - name: Check that the plugin exports GetPjrtApi
        run: |
          "C:/Program Files/LLVM/bin/llvm-readobj.exe" --coff-exports xla/bazel-bin/xla/pjrt/c/pjrt_c_api_cpu_plugin.so | grep -w GetPjrtApi

      - name: Package
        run: |
          cp xla/bazel-bin/xla/pjrt/c/pjrt_c_api_cpu_plugin.so pjrt_cpu.dll
          FILENAME="pjrt-${VERSION}-windows-x86_64.tar.gz"
          tar -czf "$FILENAME" pjrt_cpu.dll
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FILENAME }}
          name: PJRT ${{ github.event.inputs.release_tag }}
          tag_name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.release_tag != 'pjrt' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
